  13-61-staff-list-returns-citizens-hotfix: done  # [EMERGENT + SHIPPED 2026-08-09, reported by Awwal from the live Super Admin UI, fixed in an isolated worktree while 13-46 was developed on main. THREE SYMPTOMS, ONE ROOT CAUSE + ONE AGGRAVATOR. Root: StaffService.listUsers had NO role predicate at all, so 'the staff list' meant EVERY row in users — on prod 114 public_user respondents beside 3 actual staff, listed by name on a Super Admin page (closer to data-exposure than cosmetic, hence hotfix not Epic 12). Aggravator: registry.api called /staff?roleFilter=enumerator&pageSize=500 and NEITHER PARAM EXISTS (controller reads page/limit/status/roleId/lgaId/search) — both silently discarded, returning the unfiltered table. ⚠️ A WRONG PARAM NAME FAILS PERMISSIVELY: no 400, no 404, just MORE than asked for — which is why it survived review and every symptom looked like a UI bug. SHIPPED: (1) citizens excluded BY DEFAULT IN THE SERVICE, not by fixing the query string, so a caller that forgets the filter cannot pull citizens from a staff endpoint (opt in via includePublicUsers); (2) `role` filter by NAME alongside roleId — requiring a UUID is what produced the invented roleFilter; (3) picker corrected to ?role=enumerator&status=active&limit=100 so a DEACTIVATED account cannot filter a live registry view. 4 new real-DB tests asserting BY IDENTITY not by count ('returns 3 rows' passes over the hole when a fixture changes), incl. the general property: an UNKNOWN role name returns NOTHING rather than everything — failing CLOSED on an unrecognised filter is the real lesson. RED-verified. 45 existing staff tests green, tsc 0, eslint 0. ⚠️ THE TEST FOUND A BUG IN THE FIX on first run: inside db.query.users.findMany Drizzle renders ${roles.id} as "users"."id" (outer alias) so the subquery hit 42703 — rewritten with an explicit `r` alias; a test asserting 'the call succeeds' would have gone green over a broken query. ⛔ REGISTRY DATE FILTER NOT FIXED — traced end-to-end and it READS correct while the operator observed it failing, so it needs a measurement not a guess (pending Network-tab evidence). Suspicion recorded not acted on: new Date('YYYY-MM-DD').toISOString() is UTC midnight = 01:00 WAT, so 'today' would silently drop the first hour of the Nigerian day. ✅ DEPLOYED 189bbe2 2026-08-10, VERIFIED ON PROD ROWS not on a SHA: users=124 of which 120 are public_user, the new predicate returns 4, an UNKNOWN role name returns 0 (fail-closed confirmed on live data), role=enumerator&status=active returns 1 so the deactivated test account is excluded. CI/CD 31381818869 + E2E 31381818949 both success (deploy + smoke-e2e green); pm2 oslsr-api restarted; health 200. Deployed staff.service.ts:124/:133 grepped ON THE VPS. ⚠️ MEASUREMENTS CARRY THEIR SHA: the '114 citizens beside 3 staff' above was true at 0ab4574; at 189bbe2 it is 120 beside 4 (growth, not regression). ⚠️ THIS LINE READ done/'SHIPPED' FOR 24H WHILE THE COMMIT WAS UNPUSHED — committed is not shipped (handoff §2y + §7m). R1 (registry DATE filter) is RE-HOMED not ACCEPTED: out of this story's scope, owner Awwal/PM triage, trigger = Network-tab evidence of whether dateFrom is actually sent. 📋 Prod holds exactly ONE active enumerator account (Lawal Kolade) — no field officers provisioned. Story file 13-61-staff-list-returns-citizens-hotfix.md]
  13-62-a-query-parameter-the-server-never-read: ready-for-dev  # [EMERGENT 2026-08-10 (John/PM), generalising 13-61 from ONE call site to the CLASS. ⛔ NOT A FIELD-DAY GATE — the field-day set is 13-57 + 13-59 + 13-60 + enumerator accounts + the 13-4 R8 briefing; 13-46 gates the jingle. This is the hotfix batch, ships alongside, must not become a fifth gate. || CARVED OUT OF THE SCP ON AWWAL'S RULING (2026-08-10): C10 was a table row in sprint-change-proposal-2026-08-09-portfolio-triage.md, and an action that stays in an SCP is an action that never fires — an SCP may hold DECISIONS only; every action it implies leaves with a story number or it does not exist. || FINDING THAT 13-61 MISSED: `pageSize` was NOT invented, it was BORROWED. Measured 2026-08-10 — pageSize is the dialect in 6 controllers (assessor/export/fraud-detections/marketplace/productivity/respondent), `limit` in 2 (staff/reveal-analytics). The web dev wrote the name that works on six other endpoints; /staff is the OUTLIER and the caller was being consistent. And there is NO .strict() query validation anywhere in the API (only registration's BODY schema), so unknown query params are silently dropped API-wide and nothing in the codebase can notice. || ⚠️ THE EXPECTED RESULT IS CLEAN, AND THE STORY SAYS SO UP FRONT. PM spot-checked 4 hardcoded-name sites 2026-08-10 and ALL FOUR are read by their controllers: official.api:29 days→report.controller:60; submission.api:54 scope→form.controller:261; submission.api:64 days→form.controller:314; reveal-analytics.api:10/15/20 days+limit→reveal-analytics.controller:6-7 (zod). So this is NOT a bug hunt and must not be sold as one — its value is (a) converting 'we think the rest are fine' into evidence and (b) the guard. A clean audit is a RESULT, recorded as such, or a green gate becomes indistinguishable from a skipped one. || SCOPE MEASURED: 15 inline apiClient('…?…') sites + 118 URLSearchParams lines; the INLINE literals are the risk class (staff.api built through a ListStaffParams interface and was correct; registry.api wrote a literal and was wrong) but builders are audited too — a builder can hold a wrong name, it merely holds it in one place. AC1 table needs file:line on BOTH sides; a row without a server-side citation is not audited. || AC2 fixes 13-61's way — at the SERVICE DEFAULT, not the query string, so a caller that forgets cannot over-fetch; an unknown filter must return NOTHING rather than everything. AC3 IS THE ACTUAL DELIVERABLE: a drift guard (13-54 precedent) that reds when a web call site sends a param no controller reads, RED-VERIFIED by restoring roleFilter/pageSize into registry.api. 🚨 AC3.3 — THE GUARD MUST RUN ON THE COMMITS IT POLICES: 13-45's residual guard sits in @oslsr/api:lint which declares no inputs, so turbo hashes only apps/api while the stories it inspects live at repo root (three consecutive pre-commit runs replayed an identical hash with a story edited between them — measured 2026-08-09, handoff §2y, commit 2d9bc1e). This guard reads apps/web AND apps/api; attached to a task hashing one of them it is BORN with 13-45's defect. Declare inputs explicitly and PROVE it by editing a web file and watching it re-run rather than replay. AC4: registry.api now sends limit=100 against a server cap of 100 (staff.controller:44) with NO pagination — the same permissive truncation 13-61 just fixed, re-armed at a higher threshold; StaffListResponse carries the total, so the picker COMPARES AND SAYS SO. ⚠️ A written 'reopen if >100 enumerators' trigger is explicitly NOT acceptable — a trigger contingent on someone remembering is [[pattern-ship-a-fix-that-never-fires]], this project's top defect class. || ⛔ OUT OF SCOPE AND THIS IS THE RISKY HALF: runtime .strict() rejection of unknown query params (inverts the failure direction from 'returns too much' to '400s' across 8 controllers and every list consumer — shipping that into a field push + jingle + client assessment turns a silent over-fetch into a visible outage) and the pageSize/limit dialect merge. Both → backlog, named owner, sequenced AFTER the field work; let AC1's evidence size them. Registry DATE filter (13-61 R1) also out — no measurement yet, discharges free during the §5.0 item-0 export walk; do not fix it blind. || CONTEXT: 5 instances of this class in one 2026-08-09/10 session — a pipe returning tail's exit code, a cached lint scanning a deleted file, a guard whose cache key omits its artefact, a missing NOT IN returning 124 rows for 4, and a monitor that could never emit. Every one reported success or silence while measuring nothing. Standing argument for SCP C2/F3 (rename Epic 12 to the measurement-honesty track). Story file 13-62-a-query-parameter-the-server-never-read.md]
  13-56-commit-story-coverage-audit-and-guard: backlog  # [EMERGENT 2026-08-08 (John/PM) from Awwal's question "do all commits map to a story?". ⚠️ MEASUREMENTS BELOW ARE DATED — RE-MEASURE BEFORE STARTING; every push moves them. || THE FINDING IS NOT THE AUDIT, IT IS THAT THE TOOL FOR IT ALREADY EXISTS AND HAS NEVER WORKED. `scripts/retro-commits.sh` (prep-6-commit-history-retro-tool, `done` 2026-03-06, code-review passed) groups commits by story key with an `Uncategorized` bucket — exactly the audit asked for. Run over ANY window it reports ~100% Uncategorized, including the March-2026 era it was built for. THREE VERIFIED DEFECTS: (1) line 110 feeds awk `git log --format="%h %s"` — SUBJECT ONLY — so patterns 5/6/7, whose own comments say "in body", are UNREACHABLE BY CONSTRUCTION; 389 commits carry `Story X-Y` somewhere, mostly in bodies. (2) No pattern matches the conventional-commit scope actually in use, `fix(13-4):` / `feat(13-53):` — 288 commits. (3) It then prints `Tip: 100% uncategorized. Add story keys to commits` — a DIAGNOSTIC BLAMING THE COMMITS while looking straight at `fix(13-4):` (handoff §2l: a helper may only NAME a cause its own evidence identifies). Textbook [[pattern-monitor-measuring-something-else]] + [[pattern-test-that-passes-over-a-hole]]: exits 0, prints a well-formed report, every line wrong since the day it was reviewed and marked done. || SPLIT THE STORY — the two halves have OPPOSITE timing profiles and bundling them inherits the worst of both. (A) EXTRACTOR FIX + GUARD: cost is FLAT whenever done, value is proportional to commits that come AFTER, so every day of delay is permanently-lost coverage. Fix = feed `%h %s%n%b`, add the scope pattern (~6 lines of awk), then a pre-push/CI check that a commit touching apps/**/src or packages/**/src either names a story or carries an explicit `Story: none — <reason>` trailer. Same shape as 13-37/13-41/13-54: make the wrong way hard to WRITE. DO EARLY. (B) HISTORICAL BACKFILL: cost GROWS with commit count, value DECAYS as files get rewritten — this is the half that goes stale. Bound it BY ERA, not "all history"; an orphan in a file since rewritten is archaeology. || DESIGN NOTES: two signals, not one — flag only when the message names no story AND no story `## File List` claims the touched files (known error source: File Lists are themselves sometimes under-recorded — publish the caveat, do not imply precision). Rank by blast radius (an orphan in respondent-identity.ts outranks fifty in fixtures), not by date. CALIBRATE ON KNOWN ANSWERS FIRST: `aac6153` (retro-housed as 13-52) and `16b02ee` (housed in 13-46) must classify HOUSED; `077e129` (IPv6 bypass, housed NOWHERE — 13-46 documents the per-email limiter at line 505 but never mentions IPv6) must classify ORPHAN. A known-positive AND a known-negative before any bulk run. Decide the three outcomes BEFORE running (HOUSED-RETRO / NEW STORY / NO-STORY-BY-RULE + reason) or it becomes a 300-item list nobody triages, like the 299 unchecked boxes already on this board. || TRIGGER, NOT A DATE — dates on non-gating work slip. Half (B) IS the Epic-13 retrospective's input: retro-commits.sh exists because of Team agreement A10, "commit history is a retro input". Not new work to find room for; work the retro already implies, currently running on a broken tool. And once (A) ships the historical set is CLOSED — you audit a fixed population instead of chasing a moving one, which is what makes this backlog entry go stale today. || ⚠️ RECURSION TO RESPECT: the extractor fix is ~6 lines and tempting to do inline — but a fix with no story is precisely what this story audits. If it is done inline, record it HERE. Baseline 2026-08-08: 860 commits, 499 subjects naming a story id, 288 using the unmatched scope form.]
