  13-46-public-burst-readiness-send-caps-and-registration-throttle: ready-for-dev  # 2026-07-30 (Bob/SM draft, EMERGENT from Awwal's decision to run a RADIO JINGLE at the public wizard BEFORE the email blasts). 🚦 LAUNCH-ADJACENT — it gates the jingle, which precedes the blasts; NOT post-launch hygiene like 13-41/42/43/44. Thesis: nothing in the code blocks the jingle, but the CONTROLS are wrong in BOTH directions at once. (1) `registrationRateLimit` is max 5 / 15min PER IP with the docblock "Prevents mass account creation" (middleware/registration-rate-limit.ts:20-24,31-32) mounted on the ACCOUNTLESS public wizard submit (routes/registration.routes.ts:51; the route comment at :48-50 records it was transplanted from the legacy /auth/public/register discipline). Under Nigerian carrier NAT that IP is a whole carrier — `realIpMiddleware` resolves CF-Connecting-IP BEFORE every limiter (app.ts:127-133) — so the 6th listener behind a carrier IP in 15 min gets 429, traced only by one `logger.warn` (`registration.rate_limit_exceeded`, :38-44): no queue, no retry, no record of the person lost. `wizardDraftRateLimit` fails EARLIER and more silently — 120/IP/15min sized from "typical 20-60 saves per session" with the explicit assumption "Shared NATs (~5 wizards concurrently) stay well inside budget" (wizard-draft-rate-limit.ts:20-28,38-39) ⇒ ~2-6 concurrent sessions per carrier IP exhausts it. (2) The asset actually at risk — SENDING REPUTATION — has NO ceiling: every public registration fires the thank-you SYNCHRONOUSLY IN-REQUEST (controller:855-863 `void runPostSubmissionSideEffects` → submission-processing:841,856,909,927,1048 `AUTO_CAMPAIGN_ID='thankyou-referral-auto'` → email.service dispatch:100,115; NEVER queued — email.queue.ts is staff-invite/reset/payment only), and `NotificationMeter` holds ONLY TTL constants (:60,62), is documented "Fail-OPEN" (:23-25) / "Counted, not blocked: the send already happened" (:150-153), and is called AFTER the provider with its return d