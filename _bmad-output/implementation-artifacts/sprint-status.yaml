  13-45-ci-guard-done-with-open-residuals: ready-for-dev  # [✅ ALL THREE RESIDUALS RESOLVED 2026-08-11 — R1+R2 CLOSED-BY-RULING (SCP §10.14 R-C: split `lint-story-residuals` out of `lint` into its OWN turbo task with `inputs` covering `_bmad-output/**` — both options this story proposed were rejected, one taxing every commit with an apps/api eslint re-run, the other leaving the local signal misleading; the split costs neither). ⚠️ CLOSED MEANS RULED, NOT SHIPPED — the follow-up is unbuilt and the story stays ready-for-dev. R3 RULED BY PM (delegated in §10.14): `RE-HOMED` IS NOT A LEDGER STATE and the guard must NOT learn it — a re-homed item is another story's scope, so it is finished HERE; teaching one new word invites PARKED/SUPERSEDED/DEFERRED next and turns a binary check into an unbounded vocabulary. THE RULE: a re-homed item is DELETED from the ledger and replaced by a one-line pointer naming the RECEIVING STORY ID; if no receiving story exists it stays OPEN — that clause is load-bearing, without it the ruling would legalise the silent drop the guard exists to prevent. ⚠️ IMMEDIATE CONSEQUENCE, AWWAL TO CALL: exactly ONE real RE-HOMED row exists in the corpus — 13-61's R1 (the registry DATE filter), on a story marked `done`, passing the guard today only because the word is unrecognised. Under this ruling it either gets a receiving story id or reverts to OPEN (which would correctly bounce 13-61 out of `done`). || ⚠️ ROW CREATED 2026-08-10 (John/PM) — THE STORY FILE HAS EXISTED SINCE 2026-08-05 WITH NO BOARD ROW AT ALL. The story that built the guard enforcing "no `done` while a residual is OPEN" was itself invisible to the board that tracks stories, which is why its defect had nowhere to be recorded. Found by grepping story files against sprint-status keys; it was the ONLY 13-4x/5x/6x file missing a row. [[pattern-a-record-about-the-work-is-not-the-work]] at the board level. || SHIPPED 2026-08-05 (Claude adjudication): detector apps/api/src/lib/story-residual-g