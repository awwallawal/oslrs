  13-52-deploy-resilience-open-tabs-survive-a-release: done  # [EMERGENT 2026-08-07, hotfixed as aac6153 BEFORE the story existed - recorded as a process inversion, not hidden. The deploy moves the whole docroot aside (mv /var/www/oslsr /var/www/oslsr.bak.prev), so EVERY fingerprinted chunk of the previous build vanishes the instant a deploy lands; an open tab then 404s on its next lazy route and shows "Page Error" with a Try Again button that cannot work. Invisible today, breaks every enumerator mid-interview once they keep the app open all day. TWO fixes kept: lazy-with-recovery.ts reloads ONCE (sessionStorage-guarded, re-armed on success, aliased as `lazy` so all 99 routes are covered and a new route cannot forget it), and nginx serves the previous build's chunks from the rollback dir. Two nginx traps caught pre-ship: a plain /assets/ prefix would never fire (regex locations win for .js - needs ^~), and ^~ alone would have stripped CSP/HSTS (add_header kills inheritance). OPEN: no automated test either side; .bak.prev holds one generation only; no alert on sustained fallback serving.]
