  13-60-a-failed-selfie-must-not-be-swallowed: done  # [✅ DEPLOYED 6876b9f + VERIFIED ON PROD 2026-08-14. R3 DISCHARGED ON PROD DATA: liveness_score no longer exists (0), all 4 photo_* columns present, 3 rows carry a sharpness score, 3 users hold an ID card, 3 backfilled photo_status='saved' — scored==carded IS the proof, because a drop+create would have left scored=0 against 3 carded. CI/CD 31745170166 + E2E 31745170109 both success, deploy TAKEN with all 10 jobs green. 📌 HELD AT `review` THROUGH ONE RED CI RUN AND ONE SKIPPED DEPLOY before flipping — run 31737577114 had test-api red so deploy was SKIPPED; had this been marked done at dev handover the board would have advertised a story CI never let through. 🔴 R5 — THE RUNNER CRASHED ON EVERY FRESH DATABASE (`relation "users" does not exist`): ADD COLUMN IF NOT EXISTS guards the COLUMN not the TABLE, and this runner is ordered BEFORE db:push by design. Caught by CI, not by any local gate — app_test always had a users table, so that branch had NEVER executed. Fixed with tableExists() early-return, RED-verified on an empty DB (runner exit 0, then full db-push-full pipeline exit 0 creating all four columns). ⚠️ ADJUDICATED 2026-08-13 — original hold note: ✅ ADJUDICATION GATES (run by adjudication, not the dev's self-report): tsc api 0 / web 0; eslint 0; the three drift guards run DIRECT and uncached (Pitfall #47) — registry-read 372 clean, respondent-write 372 clean, story-residual 317 clean; 111 API tests across the 5 touched files; 92 web tests across 6 files isolated. TWO RED-VERIFIES BY ADJUDICATION: (1) neutered PHOTO_FAILURE_REASON_SYSTEM → "expected 'S3 upload failed: connection refused' not to contain 'S3 upload failed'", reverted → 35/35 green; (2) the NEW lost-rename guard → simulated drop+create exits 1, healthy state exits 0. ⛔ THE "EVIDENCE ONLY EXISTS AFTER DEPLOY" CLAIM IS WITHDRAWN — the rename ordering was PROVEN LOCALLY on app_test: pre-migration state rebuilt, liveness_score=0.7777 seeded, real pipe