  12-7-registry-table-data-status-and-reference-code: ready-for-dev  # [⏩ INHERITED 2026-08-11 — THE REGISTRY DATE FILTER IS ONE HOUR OFF (re-homed from 13-61 R1 under 13-45's R3 ruling: RE-HOMED is not a ledger state, so a re-homed item names a receiving story or stays OPEN). Landed HERE and not on 12-4/12-5/12-6 deliberately — those three are on the BLAST GATE (R-F) and a critical-path story must not absorb unrelated scope; the registry table is this story's surface. TWO HYPOTHESES DEAD, both cheap: (1) 'respondents has no created_at/updated_at' — IT HAS BOTH, timestamptz (Awwal's hypothesis, one query to falsify); (2) 'the params never reach the server' — registry.api.ts:26-27 sends dateFrom/dateTo through a TYPED builder, controller zod accepts ISO, buildFilterConditions uses r.created_at >= $1::timestamptz for BOTH list and count. THE WIRING IS COMPLETE. THE DEFECT IS IN THE BROWSER AND THE TWO ENDS USE DIFFERENT RULES: RegistryFilters.tsx:184 dateFrom = new Date(value).toISOString() — 'YYYY-MM-DD' parses as UTC MIDNIGHT = 01:00 WAT — while :196 dateTo appends an explicit 'T23:59:59.999Z'. So 9 Aug → 9 Aug queries 01:00 WAT 9 Aug → 00:59:59 WAT 10 Aug: a full 24h SHIFTED ONE HOUR off the Nigerian day. Anyone registered 00:00-01:00 WAT is MISSING; anyone in that hour the NEXT day is wrongly INCLUDED. ⚠️ FOUND BY READING, NOT BY REPRODUCING THE OPERATOR'S CASE — a one-hour window is small and may not be all of it. DO THE 2-MINUTE NETWORK-TAB CHECK FIRST (does dateFrom appear, with what value), then fix; this row's entire history is 'do not fix it blind'. BUILD: construct BOTH boundaries in WAT the SAME way (the asymmetry is the smell); DO NOT REMOVE the filter (proposed and rejected 2026-08-11 — it works an hour out, and 'reintroduce later' is [[pattern-ship-a-fix-that-never-fires]]); write Africa/Lagos, NOT a hard-coded +1 (no DST today, but an integer nobody can justify is a bug in waiting); RED-VERIFY ON THE BOUNDARY — seed a respondent at 00:30 WAT and assert