name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Story 13-36 AC4: on-demand burn-in. A determinism fix is only credible if you
  # can re-prove it cheaply, so the same suite can be re-run N times from the
  # Actions tab instead of by pushing empty commits.
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Burn-in: run every test N times (1 = a normal run)'
        required: false
        default: '1'

# Cancel in-progress runs for the same branch
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # A normal run is ~6 min; the headroom is for a manual `repeat_each` burn-in.
    timeout-minutes: 25
    # Stabilization period closed 2026-05-09: Pitfall #31 (cache key fix)
    # exposed 7 silently-failing tests, all triaged + fixed (6 selector-rot,
    # 1 fixture-gap skipped with TODO).
    #
    # ── STATUS OF THIS WORKFLOW (Story 13-36 AC4, decided 2026-07-26) ──────────
    # INFORMATIONAL, NOT A DEPLOY GATE — and to be treated as a REAL signal.
    #
    #   * What gates deploy is `ci-cd.yml` (its own smaller `smoke-e2e` job).
    #     This workflow has never blocked a release and is not proposed as a
    #     required check: the team pushes straight to `main`, so a required
    #     PR check would have nothing to attach to.
    #   * "Informational" is about BLOCKING, not about trust. The rule is:
    #     a red run gets TRIAGED, never reflexively re-run. If a re-run is the
    #     answer, the flake gets a story — that reflex is what let the 13-32
    #     turbo-2.x webServer regression (DATABASE_URL filtered out by strict
    #     env mode) hide under the messaging flake for days.
    #   * The one known-flaky test (messaging broadcast composer) was made
    #     deterministic in 13-36 — see apps/web/e2e/helpers/messages.ts. To
    #     re-establish trust after any change here, run this workflow manually
    #     with `repeat_each: 3` and expect an unbroken green.
    #   * The earlier header line "E2E is now a real CI gate" was wrong (it
    #     never gated deploy) and is what made the red/green ambiguous.

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-for-ci
      REFRESH_TOKEN_SECRET: test-refresh-token-secret-for-ci
      PUBLIC_APP_URL: http://localhost:5173
      VITE_E2E: 'true'
      E2E: 'true'

    steps:
      - uses: actions/checkout@v5

      # SHA-pinned to a Node 24 commit on main — see ci-cd.yml for rationale.
      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a
        with:
          # Pin pnpm — see ci-cd.yml for rationale (pnpm 10.x requires Node 22.13+; we use Node 20).
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Push database schema
        run: pnpm --filter @oslsr/api db:push:force

      - name: Seed database
        run: pnpm --filter @oslsr/api db:seed:dev

      # Cache Playwright browsers to avoid ~90s install on every run.
      #
      # Pitfall #31 (2026-05-09): the cache key MUST track the resolved
      # Playwright version, not just `apps/web/package.json` text. With a
      # caret-pinned `^1.58.2`, the package.json hash stays stable across
      # 1.58.x → 1.59.x bumps, but Playwright's on-disk browser path includes
      # a revision number (e.g. `chromium_headless_shell-1208/`) that bumps
      # with the npm version. Restoring an older cached path means the test
      # runner fails at browser launch with "Executable doesn't exist".
      #
      # Two-part fix:
      #   1. Include `pnpm-lock.yaml` (resolved version) AND a manual `v2-`
      #      prefix in the key so the next bump invalidates the cache and any
      #      future ops can bust manually by incrementing.
      #   2. Tighten `restore-keys` to only match v2-or-later — the previous
      #      `playwright-${{ runner.os }}-` fallback restored the v1 broken
      #      cache, which is why fe878af + 096086e both failed identically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v2-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-v2-

      # Pitfall #31 (2026-05-09): use the project-pinned Playwright via
      # `pnpm --filter @oslsr/web exec playwright`, NOT `pnpm dlx playwright`.
      # `dlx` fetches a separate (latest) Playwright that may install a newer
      # browser revision than the project's locked version expects, so the
      # cached binaries silently disagree with the test-runner's expectations.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @oslsr/web exec playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @oslsr/web exec playwright install-deps chromium

      # `--repeat-each` is forwarded through turbo's `--` passthrough so the
      # burn-in run is byte-identical to a normal run apart from the repeat count
      # (same turbo task = same `test:e2e.env` allowlist; running playwright
      # directly here would re-open the 13-32 strict-env trap). The count comes in
      # via env, never interpolated into the shell command.
      #
      # The count is validated and BOUNDED before use (review AI-15). A normal run
      # is ~6 min, of which ~3 is fixed setup, so the job's 25-min budget covers
      # roughly repeat_each=7. An unvalidated larger value would blow the timeout
      # and produce a red that means nothing — re-creating the untrustworthy-red
      # problem this story exists to end. Fail LOUDLY at the input instead.
      - name: Run E2E tests
        run: |
          set -euo pipefail
          if ! [[ "$REPEAT_EACH" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repeat_each must be a positive integer (got '$REPEAT_EACH')"
            exit 1
          fi
          if [ "$REPEAT_EACH" -gt 7 ]; then
            echo "::error::repeat_each=$REPEAT_EACH exceeds the 25-min job budget (max 7)."
            echo "::error::Raise timeout-minutes in the same change if you genuinely need a deeper burn-in."
            exit 1
          fi
          pnpm exec turbo run test:e2e -- --repeat-each="$REPEAT_EACH"
        env:
          CI: true
          REPEAT_EACH: ${{ inputs.repeat_each || '1' }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # SHA-pinned to a Node 24 commit on main — see ci-cd.yml for rationale.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
          # Story 9-62: report is always produced; ignore-if-missing is harmless
          # belt-and-suspenders.
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        # SHA-pinned to a Node 24 commit on main — see ci-cd.yml for rationale.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-test-results
          path: apps/web/test-results/
          retention-days: 30
          # `test-results/` only exists when a spec FAILS (traces/screenshots);
          # on a green run it's empty → upload-artifact warns "No files were found".
          # That warning is benign noise — suppress it (Story 9-62 follow-up).
          if-no-files-found: ignore
