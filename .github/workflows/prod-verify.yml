name: Prod Verify (read-only)

# WHY THIS EXISTS
# ---------------
# The pre-blast gate (docs/runbooks/pre-blast-dry-run.md) has checks that are
# MANDATORY before firing a send — above all §2's ledger-liveness SELECT, because
# `recordCampaignSend` is FAIL-SOFT: if the ledger silently stops writing, every
# blast cohort is un-deduped and the double-send this system exists to prevent
# ships looking "done".
#
# Until now the only way to run those checks was `ssh` over Tailscale. On
# 2026-07-31 that path failed repeatedly while the SAME box served public HTTPS in
# 1.9s: Tailscale could not establish a direct connection and was relaying via
# DERP "sfo" at 386-826ms, and eventually stopped passing traffic entirely
# (`tailscale ping` → no reply) even though the peer showed Online. A verification
# step you cannot run on blast day is not a gate.
#
# GitHub Actions already SSHes into this VPS on every deploy, over the public
# path, and has never failed. This job reuses that proven route. It is the
# FALLBACK, not the replacement: Tailscale remains the interactive tool.
#
# READ-ONLY BY CONSTRUCTION, not by discipline
# --------------------------------------------
# Every psql call runs with `default_transaction_read_only=on`, so a write is
# rejected by POSTGRES even if someone later edits a query into this file. That is
# deliberate: "we only put SELECTs in here" is a promise, and this repo has spent
# two sessions learning that a guard beats a promise.

on:
  workflow_dispatch:
    inputs:
      control_email:
        description: 'Optional: a positive-control address to check for ledger/suppression rows (e.g. lawalkolade+radio4@gmail.com)'
        required: false
        default: ''

concurrency:
  group: prod-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only prod verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run the pre-blast read-only checks on the VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          CONTROL_EMAIL: ${{ inputs.control_email }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CONTROL_EMAIL
          script: |
            set -euo pipefail
            # Postgres refuses any write from this session, so this job cannot mutate
            # prod even by mistake.
            #
            # ⚠️ A FUNCTION, not a variable — and that is load-bearing, not style.
            # The first cut was PSQL="docker exec -e PGOPTIONS=-c\ default_... " and it
            # FAILED on the first real run: expanding an unquoted variable word-splits on
            # that embedded space, so docker read `default_transaction_read_only=on` as the
            # CONTAINER NAME ("No such container"). A shell function preserves argument
            # boundaries; a string variable cannot. (Found 2026-08-01 by running it — the
            # YAML parsed, the secrets resolved and the read-only flag was present, i.e.
            # everything static was green. Pitfall #47: verify the RUN, not the artifact.)
            psql_ro() {
              docker exec -e PGOPTIONS='-c default_transaction_read_only=on' oslsr-postgres psql -U oslsr_user -d oslsr_db -X -q "$@"
            }

            echo "=============================================================="
            echo "1. DEPLOYED SHA + BASELINE  (pre-blast-dry-run.md §0)"
            echo "=============================================================="
            echo "VPS HEAD: $(cd /root/oslrs && git rev-parse --short HEAD)"
            psql_ro -c "
              SELECT (SELECT count(*) FROM respondents)     AS respondents,
                     (SELECT count(*) FROM submissions)     AS submissions,
                     (SELECT count(*) FROM campaign_sends)  AS campaign_sends,
                     (SELECT count(*) FROM registry_unified) AS registry_unified;"
            echo "^^ RE-MEASURE, never 'restore to N' — organic registrations arrive."
            echo "   Teardown deletes the rows YOU created, BY ID (retro R-5)."

            echo
            echo "=============================================================="
            echo "2. WIZARD DRAFT CONTRACT  (Pitfall #46 / Story 13-47)"
            echo "=============================================================="
            # ⚠️ `sections`, NOT `questions`. form_schema's top-level keys are
            # id/title/status/version/SECTIONS/createdAt/choiceLists/calculations —
            # questions are NESTED INSIDE sections. The first cut read
            # `form_schema->'questions'`, which is NULL, and `jsonb_array_elements(NULL)`
            # returns ZERO ROWS rather than erroring: the query "succeeded", printed an
            # empty table, and this job went GREEN while its most important check
            # measured nothing (found 2026-08-01 by reading the output of a passing run).
            # `value #>> '{}'` unwraps the jsonb string without quote-escaping games.
            #
            # And because a check that silently returns nothing is the exact failure this
            # job exists to prevent, ZERO ROWS IS NOW A HARD FAILURE.
            CONTRACT=$(psql_ro -t -A -F'|' -c "
              SELECT f.id,
                     jsonb_array_length(f.form_schema->'sections'),
                     3 + jsonb_array_length(f.form_schema->'sections') + 1
              FROM questionnaire_forms f
              WHERE f.id::text = (SELECT value #>> '{}' FROM system_settings
                                  WHERE key = 'wizard.public_form_id');")
            if [ -z "$CONTRACT" ]; then
              echo "::error::Wizard draft contract returned NO ROWS — the pinned form could not be resolved."
              echo "::error::Either wizard.public_form_id is unset/stale, or form_schema's shape changed."
              echo "::error::Do NOT read an empty result as 'no problem' — this check measured nothing."
              exit 1
            fi
            echo "pinned_form | sections | wizard_steps_N"
            echo "$CONTRACT"
            echo "-- draft step distribution: MAX below N means autosave is being rejected --"
            psql_ro -c "
              SELECT current_step, count(*) AS drafts
              FROM wizard_drafts GROUP BY current_step ORDER BY current_step;"

            echo
            echo "=============================================================="
            echo "3. LEDGER LIVENESS  (§2 — MANDATORY, recordCampaignSend is FAIL-SOFT)"
            echo "=============================================================="
            psql_ro -c "
              SELECT count(*) AS sends_last_24h, max(sent_at) AS latest
              FROM campaign_sends WHERE sent_at > now() - interval '24 hours';"
            psql_ro -c "
              SELECT category, channel, count(*) FROM campaign_sends
              GROUP BY 1,2 ORDER BY 3 DESC;"

            echo
            echo "=============================================================="
            echo "4. ATTRIBUTION  (13-47 AC8 — assert the READ, not just the write)"
            echo "=============================================================="
            psql_ro -c "
              SELECT COALESCE(raw_data->'campaign_source'->>'channel','(unknown)') AS channel,
                     count(*)
              FROM submissions WHERE raw_data->'campaign_source' IS NOT NULL
              GROUP BY 1 ORDER BY 2 DESC;"
            echo "-- 0 rows here while a paid channel is running = attribution is dead --"

            echo
            echo "=============================================================="
            echo "5. DRAFT-ADOPTION PROGRAMME (Story 13-49)"
            echo "=============================================================="
            echo "-- adopted / enriched, by AC11's rollback marker (NOT a stored total) --"
            psql_ro -c "
              SELECT r.metadata->>'adopted_by'      AS programme,
                     r.status,
                     count(*)                       AS respondents,
                     min((r.metadata->>'adopted_at')::timestamptz)::date AS first,
                     max((r.metadata->>'adopted_at')::timestamptz)::date AS last
              FROM respondents r
              WHERE r.metadata ? 'adopted_by'
              GROUP BY 1,2 ORDER BY 3 DESC;"
            echo "-- AC14 NIN promotions: a DIFFERENT marker, and it needs its own line --"
            # The panel above groups by `adopted_by` and printed "(0 rows)" on 2026-08-03 while
            # AC14 had just promoted 10 people, because a promotion is not an adoption: it carries
            # `nin_promoted_by`. A gate that cannot see an action which actually happened reads as
            # "nothing happened" — the exact failure mode this file exists to prevent.
            psql_ro -c "
              SELECT r.metadata->>'nin_promoted_by' AS programme,
                     r.status,
                     count(*)                       AS respondents,
                     max((r.metadata->>'nin_promoted_at')::timestamptz) AS latest
              FROM respondents r
              WHERE r.metadata ? 'nin_promoted_by'
              GROUP BY 1,2 ORDER BY 3 DESC;"
            echo "-- R11 REOPEN TRIGGER: every promotion must have an audit row. --"
            # The first live AC14 run wrote 10 promotions and 9 `pending_nin.promoted` rows: the
            # audit call was fire-and-forget (`logAction` returns void) and the LAST row of the
            # batch was still in flight when the script exited. Fixed by moving it into the
            # promotion's own transaction — this line is how we find out if it ever regresses,
            # because the symptom is an off-by-one that looks like a miscount.
            # STRICT EQUALITY, deliberately — not "expect a difference of 1".
            # The tempting move was to bake the known gap in as an allowance. That would have made
            # this check permanently skewed, which is how a check dies: readers learn the number is
            # "supposed" to be off, and the NEXT lost row is absorbed in silence. The gap was
            # reconciled instead (scripts/reconcile-nin-promotion-audit.ts), so the invariant is
            # clean and any drift from it is news.
            ORPHANS=$(psql_ro -t -A -c "
              SELECT count(*) FROM respondents r
               WHERE r.metadata ? 'nin_promoted_by'
                 AND NOT EXISTS (SELECT 1 FROM audit_logs a
                                  WHERE a.action = 'pending_nin.promoted'
                                    AND a.target_id = r.id);")
            # ⚠️ DO NOT print total `pending_nin.promoted` rows next to the AC14 count. The first
            # cut did, and on 2026-08-03 it rendered "10 | 87" — inviting the reading that 77 rows
            # were missing. They are not related quantities: the 9-12 pending-NIN ladder has been
            # promoting people and writing the SAME action for months (78 of those 87). The AC14
            # marker counts only what THIS programme promoted. Compare like with like.
            psql_ro -c "
              SELECT (SELECT count(*) FROM respondents WHERE metadata ? 'nin_promoted_by')     AS ac14_promotions,
                     (SELECT count(*) FROM respondents r WHERE r.metadata ? 'nin_promoted_by'
                        AND EXISTS (SELECT 1 FROM audit_logs a
                                     WHERE a.action = 'pending_nin.promoted' AND a.target_id = r.id))
                                                                                                AS ac14_with_audit_row,
                     (SELECT count(*) FROM audit_logs WHERE action = 'pending_nin.promoted')    AS all_promotions_ever;"
            if [ "$ORPHANS" != "0" ]; then
              echo "::error::$ORPHANS promoted respondent(s) have NO pending_nin.promoted audit row."
              echo "::error::A promotion without its trail means the audit write was lost — the exact"
              echo "::error::defect fixed in promote-nin.ts (R11). Investigate before trusting the counts."
              echo "::error::Remedy: pnpm --filter @oslsr/api audit:reconcile-promotions   (preview)"
              echo "::error::        pnpm --filter @oslsr/api audit:reconcile-promotions -- --apply"
              exit 1
            fi
            echo "✅ every promotion has its audit row."

            echo "-- registry split: where the programme has moved the totals --"
            psql_ro -c "
              SELECT (SELECT count(*) FROM respondents)                                    AS registry_total,
                     (SELECT count(*) FROM respondents r WHERE r.metadata ? 'adopted_by') AS from_adoption,
                     (SELECT count(*) FROM respondents WHERE status = 'nin_unavailable')  AS pending_nin,
                     (SELECT count(*) FROM wizard_drafts)                                  AS drafts_remaining,
                     (SELECT min(expires_at)::date FROM wizard_drafts)                      AS earliest_draft_expiry;"
            echo "-- D4 conversion: invited, then actually completed a registration --"
            psql_ro -c "
              SELECT count(*) AS invited_drafts_now_registered
              FROM wizard_drafts d
              WHERE EXISTS (
                SELECT 1 FROM respondents r
                JOIN magic_link_tokens m ON m.respondent_id = r.id
                WHERE lower(m.email) = lower(d.email)
                  AND EXISTS (SELECT 1 FROM submissions s WHERE s.respondent_id = r.id));"
            echo "⚠️ adoption counts must come from the adopted_by MARKER — it is also 13-49 AC11's"
            echo "   rollback key, so this panel and a rollback agree by construction."

            echo
            echo "=============================================================="
            echo "5b. STORY 9-26 INVARIANT — every respondent has a submissions row"
            echo "=============================================================="
            # 9-26 established this after the registry page showed 1 respondent against an actual
            # 43: analytics joins through `submissions`, so a respondent without one is INVISIBLE
            # to every analytics query. The invariant has lived as prose ever since
            # ([[feedback_unified_ingestion_pipeline]]: "new paths follow or document the
            # exception"), which means nothing measures it.
            #
            # The ONLY sanctioned exception is the Story 9-28 absorbed cohort: 63 respondents
            # created before submissions were written for wizard registrations. That number is a
            # CEILING, not a target — it can only shrink (if those people ever submit), never grow.
            # 13-49 adoption deliberately does NOT add to it: `adoptDraft` (D1 + D3) inserts a real
            # `submissions` row with `processed: false` and hands it to
            # SubmissionProcessingService, i.e. it reuses the canonical spine rather than forking
            # it. D2 enrichment UPDATEs an existing bare record and so cannot change the count.
            #
            # If this number GROWS, some new path is creating respondents outside the pipeline —
            # exactly what 9-26 exists to prevent, and it will present as silently missing
            # analytics rather than as an error.
            ORPHAN_RESP=$(psql_ro -t -A -c "
              SELECT count(*) FROM respondents r
               WHERE NOT EXISTS (SELECT 1 FROM submissions s WHERE s.respondent_id = r.id);")
            echo "respondents with NO submissions row: $ORPHAN_RESP  (9-28 baseline ceiling: 63)"
            psql_ro -c "
              SELECT r.status,
                     (r.metadata ? 'adopted_by')      AS from_adoption,
                     (r.metadata ? 'nin_promoted_by') AS nin_promoted,
                     count(*)
                FROM respondents r
               WHERE NOT EXISTS (SELECT 1 FROM submissions s WHERE s.respondent_id = r.id)
               GROUP BY 1,2,3 ORDER BY 4 DESC;"
            if [ "$ORPHAN_RESP" -gt 63 ]; then
              echo "::error::$ORPHAN_RESP respondents have no submissions row — above the 63 baseline."
              echo "::error::A new write path is creating respondents OUTSIDE the ingestion pipeline."
              echo "::error::They will be invisible to all 11 analytics queries (Story 9-26 BUG #2)."
              echo "::error::Find it: the adoption path (adopt.ts) is the correct model — insert a"
              echo "::error::submissions row with processed:false and call processSubmission."
              exit 1
            fi
            echo "✅ no respondent has been created outside the ingestion pipeline."

            echo
            echo "=============================================================="
            echo "5c. SAME PERSON, DIFFERENT NIN — the direction duplicate_nins CANNOT see"
            echo "=============================================================="
            # `SELECT count(*) FROM (SELECT nin ... HAVING count(*)>1)` answers "is one NIN on two
            # people?" It says NOTHING about "is one person carrying two different NINs?" — and on
            # 2026-08-04 that check reported 0 throughout an incident in which exactly that was
            # true. A green metric was doing the talking while the data was wrong.
            #
            # Why it matters more than an ordinary duplicate: a mistyped NIN is still a well-formed
            # 11-digit number, so it may be ANOTHER CITIZEN'S REAL NIN sitting on this person's
            # record. Format-only validation (13-15) cannot catch it, and neither can a uniqueness
            # index — both values are unique.
            #
            # Same identity key as the R13 dedupe guard: same phone + >= 2 shared name tokens in
            # any order (surname-first is normal here). Verified read-only over the whole table:
            # 11 same-person pairs, of which 2 carried conflicting NINs and had done since May.
            #
            # REPORTED, NOT FAILED. These are pre-existing records needing a human decision, and a
            # gate that reds on a known backlog gets ignored. It fails only if the number GROWS.
            CONFLICT=$(psql_ro -t -A -c "
              WITH pairs AS (
                SELECT a.nin AS nin_a, b.nin AS nin_b,
                       (SELECT count(*) FROM (
                          SELECT unnest(ARRAY(SELECT t FROM unnest(string_to_array(lower(coalesce(a.first_name,'')||' '||coalesce(a.last_name,'')),' ')) AS t WHERE t<>''))
                          INTERSECT
                          SELECT unnest(ARRAY(SELECT t FROM unnest(string_to_array(lower(coalesce(b.first_name,'')||' '||coalesce(b.last_name,'')),' ')) AS t WHERE t<>''))
                       ) x) AS shared_tokens
                FROM respondents a JOIN respondents b
                  ON a.phone_number = b.phone_number AND a.id < b.id
                 AND a.status <> 'rolled_back' AND b.status <> 'rolled_back')
              SELECT count(*) FROM pairs
               WHERE shared_tokens >= 2 AND nin_a IS NOT NULL AND nin_b IS NOT NULL AND nin_a <> nin_b;")
            echo "people carrying TWO different NINs: $CONFLICT   (known backlog 2026-08-04: 2)"
            if [ "$CONFLICT" -gt 2 ]; then
              echo "::error::$CONFLICT conflicting-NIN people — above the known backlog of 2."
              echo "::error::A NEW one has appeared. A mistyped NIN is well-formed and may belong to"
              echo "::error::another citizen, so this cannot be resolved by picking the likelier value."
              echo "::error::Remedy: pnpm --filter @oslsr/api nin:reconfirm  (ask the holder)"
              exit 1
            fi
            echo "-- duplicate people still on file (R13 prevents NEW ones; these are history) --"
            psql_ro -c "
              WITH pairs AS (
                SELECT a.reference_code AS rec_a, b.reference_code AS rec_b,
                       a.first_name||' '||a.last_name AS name_a,
                       b.first_name||' '||b.last_name AS name_b,
                       (a.nin IS NOT NULL AND b.nin IS NOT NULL AND a.nin <> b.nin) AS conflicting_nins,
                       (SELECT count(*) FROM (
                          SELECT unnest(ARRAY(SELECT t FROM unnest(string_to_array(lower(coalesce(a.first_name,'')||' '||coalesce(a.last_name,'')),' ')) AS t WHERE t<>''))
                          INTERSECT
                          SELECT unnest(ARRAY(SELECT t FROM unnest(string_to_array(lower(coalesce(b.first_name,'')||' '||coalesce(b.last_name,'')),' ')) AS t WHERE t<>''))
                       ) x) AS shared_tokens
                FROM respondents a JOIN respondents b
                  ON a.phone_number = b.phone_number AND a.id < b.id
                 AND a.status <> 'rolled_back' AND b.status <> 'rolled_back')
              SELECT rec_a, rec_b, name_a, name_b, conflicting_nins
              FROM pairs WHERE shared_tokens >= 2
              ORDER BY conflicting_nins DESC;"

            echo
            echo "=============================================================="
            echo "6. SUPPRESSIONS"
            echo "=============================================================="
            psql_ro -c "SELECT reason, count(*) FROM email_suppressions GROUP BY 1 ORDER BY 2 DESC;"

            if [ -n "${CONTROL_EMAIL:-}" ]; then
              echo
              echo "=============================================================="
              echo "7. POSITIVE CONTROL: ${CONTROL_EMAIL}"
              echo "=============================================================="
              # ⚠️ NO psql -v / :'email' HERE. psql does NOT interpolate variables in a
              # `-c` command string — it passes `:'email'` straight to the server, which
              # answers `ERROR: syntax error at or near ":"`. (Observed on this branch's
              # FIRST execution, 2026-08-01: two earlier runs were green because neither
              # supplied control_email, so this code had never run. §2a2.)
              #
              # Inlined instead, behind a strict format check — the pattern admits no quote,
              # semicolon, backslash or whitespace, so the value cannot terminate the string
              # literal, and the session is read-only regardless.
              if ! printf '%s' "$CONTROL_EMAIL" | grep -qE '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
                echo "::error::control_email is not a valid email address: '$CONTROL_EMAIL'"
                exit 1
              fi
              psql_ro -c "
                SELECT 'campaign_sends' AS t, count(*)::text AS n FROM campaign_sends WHERE lower(email)=lower('$CONTROL_EMAIL')
                UNION ALL SELECT 'suppressions', count(*)::text FROM email_suppressions WHERE lower(email)=lower('$CONTROL_EMAIL')
                UNION ALL SELECT 'magic_link_tokens', count(*)::text FROM magic_link_tokens WHERE lower(email)=lower('$CONTROL_EMAIL')
                UNION ALL SELECT 'wizard_drafts', count(*)::text FROM wizard_drafts WHERE lower(email)=lower('$CONTROL_EMAIL')
                UNION ALL SELECT 'users', count(*)::text FROM users WHERE lower(email)=lower('$CONTROL_EMAIL');"
              echo "-- a NON-ZERO campaign_sends row after a control send is the §2 proof --"
              echo "-- magic_link_tokens must be cleaned BY EMAIL at teardown: a wizard-issued"
              echo "   token has respondent_id NULL, so deleting by RID reports DELETE 0 and"
              echo "   leaves residue (found 2026-07-30, three runs had leaked)."
            fi

            echo
            echo "=============================================================="
            echo "All queries ran with default_transaction_read_only=on."
            echo "=============================================================="
