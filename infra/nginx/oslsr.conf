# OSLRS production NGINX configuration
# Deployed automatically via .github/workflows/ci-cd.yml to /etc/nginx/sites-available/oslsr
# Source of truth — do NOT edit /etc/nginx/sites-available/oslsr directly on the VPS.
# Story 9-7: security headers + TLS hardening, 2026-04-11.

server {
    listen 80;
    server_name oyoskills.com www.oyoskills.com;
    # $host preserves whichever domain the client requested ($server_name would
    # collapse to the first listed name in this multi-domain block).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name oyoskills.com www.oyoskills.com;

    # SSL — F-024 (Story 9-9, 2026-06-09): Cloudflare Origin Certificate (Option B).
    # The origin sits behind Cloudflare (orange-cloud) with the firewall locking 443
    # to CF ranges, so we serve a CF Origin Cert (trusted only by Cloudflare, valid to
    # 2041) instead of Let's Encrypt — removes the HTTP-01/port-80 renewal dependency
    # that broke once oyotradeministry.com.ng was de-pointed. CF SSL mode = Full (strict).
    # Cert/key are installed out-of-band at /etc/ssl/cloudflare/ (NOT in the repo — secret).
    # The old LE lineage (oyotradeministry.com.ng) is retired; certbot.timer disabled.
    ssl_certificate /etc/ssl/cloudflare/oyoskills-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/oyoskills-origin.key;

    # F-024 — Cloudflare Authenticated Origin Pulls (mTLS): require a client cert
    # signed by Cloudflare's origin-pull CA, so the origin REFUSES any request not
    # arriving through Cloudflare — even one that spoofs a CF source IP. With the 443
    # firewall lock + Origin Cert, this is the §4 replacement (makes the known origin
    # IP moot — closes the bypass by identity, not by hiding the address).
    # NOTE: zone-level AOP presents CF's SHARED origin-pull cert (proves "via some CF
    # zone"); per-hostname AOP (own client cert) proves "via OUR zone" — see 9-9 #11.
    # CA at this path expires 2029-11-01 — refresh before then.
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    # TLS hardening — override stock Ubuntu http-block default at server level.
    # Main /etc/nginx/nginx.conf still lists TLSv1 TLSv1.1 — we disable them here
    # without touching the main file (surgical override).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Hide server version (main nginx.conf has server_tokens commented out)
    server_tokens off;

    # Security Headers — applied to ALL static-HTML responses.
    # API responses (/api/*) get their own headers from Express Helmet middleware;
    # the /api and /socket.io location blocks below break this inheritance chain
    # via a dummy add_header so Helmet owns the API/WS header space alone (no duplicates).
    # X-XSS-Protection deliberately "0" — the legacy Chrome/IE auditor is obsolete,
    # browsers ignore it, and OWASP recommends disabling it. CSP is the modern control.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), accelerometer=(), autoplay=(), magnetometer=(), gyroscope=(), midi=(), picture-in-picture=()" always;

    # Content-Security-Policy (Story 9-8) — MIRRORS the production Helmet policy at
    # apps/api/src/app.ts (the directive set that /api/* already enforces since sec2-3).
    # PROMOTED to enforcing 2026-05-04 (Task 7.5) after the 48h re-monitoring window
    # 2026-05-01→2026-05-03 captured zero violations against the amended allowlist
    # (commit 4f430bc added CF Insights beacon + Google Sign-In gsi/style entries).
    # The csp-parity.test.ts test file asserts that this string stays byte-equivalent
    # to the Helmet directive object — if you edit one, you MUST edit the other, or CI fails.
    # wss://oyoskills.com is the wsUrl computed from CORS_ORIGIN — hard-coded here because
    # add_header is a static string. (oyotradeministry.com.ng retired to a 302 redirect, F-024/9-53.)
    # ROLLBACK RECIPE (2-min): rename `Content-Security-Policy` back to `Content-Security-Policy-Report-Only`
    # on lines 53 + 77, commit, push. CI redeploys; violations resume reporting without blocking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.digitaloceanspaces.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://oyoskills.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-src https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; script-src-attr 'none'; report-uri /api/v1/csp-report; report-to csp-endpoint; upgrade-insecure-requests" always;
    add_header Reporting-Endpoints 'csp-endpoint="/api/v1/csp-report"' always;

    # Frontend — serve static React build
    root /var/www/oslsr;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── The service worker must NEVER be cached (2026-08-10) ─────────────────────
    # INCIDENT: on 2026-08-10 `https://oyoskills.com/sw.js` was served with
    # `Cache-Control: public, max-age=31536000, immutable`, `cf-cache-status: HIT`,
    # `Age: 549823` (6.4 days) and `last-modified: 04 Aug`. That stale worker's
    # precache manifest named `wizard.api-Dj_u-AzN.js`, which the 10 Aug build had
    # replaced with `wizard.api-CpZoi5u9.js` — so Workbox's install threw
    # `bad-precaching-response`, the new worker NEVER ACTIVATED, and every returning
    # visitor stayed pinned to the 4 August bundle. The origin was healthy the whole
    # time: 253 precache entries, 0 missing on disk. CI green, VPS SHA correct,
    # health 200 — and the deploy reaching nobody.
    #
    # ⚠️ THE `immutable` HEADER WAS NOT SET BY THIS FILE. nginx sets no Cache-Control
    # on the docroot at all (`location /` above is a bare try_files), so it came from
    # CLOUDFLARE. This block therefore does not "fix" the incident on its own — it
    # states an explicit origin directive for the edge to respect, and guarantees the
    # right header once it does. THE CLOUDFLARE CACHE RULE FOR /sw.js IS THE OTHER
    # HALF AND IS NOT OPTIONAL. Do not read a green `nginx -t` as the incident closed.
    #
    # `=` is an EXACT match and outranks every regex location, which is the same
    # precedence lesson the `^~ /assets/` note below records — it simply never
    # covered the docroot, where sw.js actually lives.
    #
    # `add_header` in a location disables inheritance of the server-level set, so the
    # full security header block is REPEATED verbatim (same reason as /assets/).
    # The CSP string is byte-identical to the server-level one on purpose:
    # csp-parity.test.ts asserts every occurrence in this file matches app.ts.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), accelerometer=(), autoplay=(), magnetometer=(), gyroscope=(), midi=(), picture-in-picture=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.digitaloceanspaces.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://oyoskills.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-src https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; script-src-attr 'none'; report-uri /api/v1/csp-report; report-to csp-endpoint; upgrade-insecure-requests" always;
        add_header Reporting-Endpoints 'csp-endpoint="/api/v1/csp-report"' always;
    }

    # ── Deploy-window fallback for fingerprinted chunks (2026-08-07) ──────────────
    # The deploy publishes by moving the whole docroot aside and laying down a clean one
    # (ci-cd.yml: `mv /var/www/oslsr /var/www/oslsr.bak.prev`). Good for one-step rollback —
    # but EVERY hashed chunk of the previous build disappears the moment a deploy finishes.
    #
    # A browser tab still running the old `index.js` then asks for a chunk hash that no longer
    # exists, gets a 404, and React's dynamic import rejects → the user sees a generic
    # "Page Error". Observed on prod: the footer "Staff Portal" link, immediately after a deploy;
    # a manual refresh "fixed" it, which is exactly what makes it easy to dismiss as a glitch.
    #
    # The previous build is still ON DISK for rollback, so serve from it when the current build
    # does not have the file. An open tab keeps working across a deploy instead of breaking on
    # its next navigation. Costs nothing: the directory is already there.
    #
    # This is belt to the braces of `lib/lazy-with-recovery.ts`, which reloads once when a chunk
    # 404s anyway. Keep BOTH: the client fix covers rollbacks and CDN edges where this directory
    # is absent, and this one avoids the reload entirely, which matters most for an enumerator
    # mid-form on a phone.
    # ⚠️ `^~`, NOT a plain prefix. nginx evaluates REGEX locations before prefix ones, and the
    # `location ~* \.(js|css|...)$` block below would otherwise win for every .js file — i.e. for
    # exactly the chunks this fallback exists to serve. `^~` stops regex evaluation for this path.
    #
    # Because `add_header` in a location disables inheritance (see the note on /api below), the
    # full static header set is REPEATED here rather than inherited. It is duplicated from the
    # regex block deliberately: dropping it would silently strip CSP/HSTS from every asset, which
    # is a security regression introduced by a caching fix.
    location ^~ /assets/ {
        try_files $uri @previous_build;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), accelerometer=(), autoplay=(), magnetometer=(), gyroscope=(), midi=(), picture-in-picture=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.digitaloceanspaces.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://oyoskills.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-src https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; script-src-attr 'none'; report-uri /api/v1/csp-report; report-to csp-endpoint; upgrade-insecure-requests" always;
        add_header Reporting-Endpoints 'csp-endpoint="/api/v1/csp-report"' always;
    }

    # Serve the PREVIOUS build's chunks during the deploy window.
    #
    # ci-cd.yml publishes by moving the whole docroot aside and laying down a clean one
    # (`mv /var/www/oslsr /var/www/oslsr.bak.prev`). Good for one-step rollback — but every hashed
    # chunk of the previous build disappears the moment a deploy finishes. A tab still running the
    # old index.js then requests a chunk hash that no longer exists, gets a 404, React's dynamic
    # import rejects, and the user sees a generic "Page Error". Observed on prod 2026-08-07 via the
    # footer "Staff Portal" link; a manual refresh "fixed" it, which is what makes it easy to
    # dismiss as a glitch rather than a deploy defect.
    #
    # The previous build is already on disk for rollback, so serve from it when the current build
    # lacks the file. Belt to the braces of `lib/lazy-with-recovery.ts`, which reloads once on a
    # chunk 404 anyway — keep BOTH: the client fix covers the case where this directory is absent
    # (first deploy, restored host), and this one avoids the reload entirely, which matters most
    # for an enumerator mid-form on a phone.
    location @previous_build {
        root /var/www/oslsr.bak.prev;
        try_files $uri =404;
        # SHORT cache: a superseded chunk exists only to bridge the deploy window.
        expires 5m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), accelerometer=(), autoplay=(), magnetometer=(), gyroscope=(), midi=(), picture-in-picture=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.digitaloceanspaces.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://oyoskills.com https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-src https://accounts.google.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; script-src-attr 'none'; report-uri /api/v1/csp-report; report-to csp-endpoint; upgrade-insecure-requests" always;
        add_header Reporting-Endpoints 'csp-endpoint="/api/v1/csp-report"' always;
        add_header X-Served-From "previous-build" always;
    }

    # API reverse proxy — Helmet (Express middleware) owns API security headers.
    # The add_header below is a deliberate, non-leaking INHERITANCE BREAKER: nginx
    # only inherits server-level add_header directives when a location defines NONE
    # of its own. Without an add_header here, /api would inherit the server block's
    # HSTS / X-Frame-Options / static-app CSP and emit them DUPLICATED alongside
    # Helmet's API headers (conflicting CSP). nosniff is safe to assert (idempotent
    # with Helmet) and carries no backend topology.
    location /api {
        # F-002 (Story 9-45) — the old internal upstream-routing hint header (a
        # backend-topology leak) is REPLACED, not just removed, by this benign
        # inheritance breaker so server-level headers don't duplicate onto /api.
        add_header X-Content-Type-Options "nosniff" always;
        # Story 9-9 AC#3 H3: explicit 127.0.0.1 (not localhost) — the API binds
        # IPv4-only via apps/api/src/lib/listen-address.ts; using `localhost`
        # here would depend on /etc/hosts resolving IPv4 first, which is fragile.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy (Socket.IO real-time notifications).
    # Same inheritance-break pattern as /api — Helmet stamps headers on the upgrade response.
    location /socket.io/ {
        # F-002 (Story 9-45) — the internal upstream-routing hint header (topology
        # leak) replaced by this benign inheritance breaker (no duplicate headers).
        add_header X-Content-Type-Options "nosniff" always;
        # Story 9-9 AC#3 H3: explicit 127.0.0.1 to match the API's IPv4-only bind.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
